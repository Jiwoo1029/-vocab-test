 $("todayLabel").textContent=`DAY ${String(pair[0]).padStart(2,"0")} + DAY ${String(pair[1]).padStart(2,"0")}`;
 $("progressText").textContent=`현재 ${completed}/30회 완료 · 다음: ${pair.map(d=>"DAY "+String(d).padStart(2,"0")).join(" + ")}`;
 $("homeBar").style.width=(completed/30*100)+"%"; $("streak").textContent=state.streak+"일 연속";
 $("alarmTime").value=state.alarm||"19:00";
}
function startToday(){
 quizWords=[]; answers=[]; idx=0;
 pairForDay(state.day).forEach(d=>{(WORDS[d]||[]).forEach(w=>quizWords.push({day:d,word:w}));});
 $("home").classList.add("hidden"); $("done").classList.add("hidden"); $("quiz").classList.remove("hidden"); renderQ();
}
function renderQ(){
 let q=quizWords[idx]; $("quizDay").textContent=`DAY ${String(q.day).padStart(2,"0")}`;
 $("counter").textContent=`${idx+1} / ${quizWords.length}`;
 $("quizBar").style.width=((idx+1)/quizWords.length*100)+"%";
 $("question").innerHTML=`<div class="card"><div class="num">${String(idx+1).padStart(2,"0")} · ${q.day===state.day*2-1?"DAY A":"DAY B"}</div><div class="word">${escapeHtml(q.word)}</div><input id="ans" autocomplete="off" placeholder="한글 뜻을 입력하세요" onkeydown="if(event.key==='Enter')nextQ()"><div id="feedback"></div></div>`;
 setTimeout(()=>{$("ans").focus()},50);
}
function nextQ(){
 let input=$("ans"); if(!input)return;
 answers[idx]=input.value.trim();
 if(idx<quizWords.length-1){idx++;renderQ();}else finish();
}
function prevQ(){if(idx>0){idx--;renderQ();$("ans").value=answers[idx]||"";}}
function finish(){
 // Since the source PDF only contains English words, the app intentionally asks for the user's Korean meaning.
 // Scoring requires an answer key, so this version records answers for self-check rather than inventing meanings.
 let key=state.day; state.results[key]={date:new Date().toISOString(),answers:answers.slice(),words:quizWords.map(x=>x.word)}; 
 state.done.push(key); state.day=Math.min(31,state.day+1);
 let today=new Date().toISOString().slice(0,10); state.lastDone=today; state.streak=(state.streak||0)+1; save();
 $("quiz").classList.add("hidden"); $("done").classList.remove("hidden");
 $("score").textContent="답안 저장 완료 · 직접 채점용";
 $("wrongList").innerHTML=`<div class="result">현재 원본 PDF에는 <b>영단어만</b> 있어 자동 정답 채점은 넣지 않았어. 네가 입력한 답은 이 기기에 저장돼. 뜻 정답표를 제공하면 자동 채점까지 연결할 수 있어.</div>`;
}
function goHome(){$("quiz").classList.add("hidden");$("done").classList.add("hidden");$("home").classList.remove("hidden");renderHome();}
function enableNotify(){
 if(!("Notification" in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}
 Notification.requestPermission().then(p=>{if(p==="granted"){alert("알림 권한이 허용되었습니다. iPhone에서는 홈 화면에 추가한 웹앱에서 사용하세요."); scheduleLocal();}else alert("알림 권한이 허용되지 않았어요.");});
}
function scheduleLocal(){state.alarm=$("alarmTime").value;save();}
$("alarmTime").addEventListener("change",scheduleLocal);
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
renderHome();
</script>
</body></html>
